<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Etali Flips</title>
  <style>
    :root { --card-w: 300px; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 32px 48px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
      color: #e6e6e6;
      background: #2b2d30;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1500px;
      margin: 0 auto 24px;
    }

    h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
    header { flex-wrap: wrap; gap: 12px; }

    .setup { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    select {
      font: inherit;
      font-size: 0.85rem;
      width: 220px;
      padding: 4px 8px;
      border: 1px solid #5a5d62;
      border-radius: 3px;
      background: #3a3d41;
      color: #e6e6e6;
    }

    .corner {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 4px 12px;
      font-size: 0.85rem;
      color: #e6e6e6;
      text-decoration: none;
      border: 1px solid #5a5d62;
      border-radius: 3px;
      background: #3a3d41;
    }
    .corner:hover { background: #46494e; }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--card-w), 1fr));
      gap: 32px;
      max-width: 1500px;
      margin: 0 auto;
      justify-items: center;
    }

    .deck { width: min(100%, var(--card-w)); }

    .deck h2 {
      margin: 0 0 10px;
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.3;
      min-height: 1.3em;
      color: #b8b8b8;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .deck .commanders {
      margin: 0 0 10px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      min-height: 2.6em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card {
      width: 100%;
      aspect-ratio: 63 / 88;
      border-radius: 4.5% / 3.2%;
      background: #1d1e20;
      overflow: hidden;
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.15s ease-in-out;
    }
    .card img.turning { transform: scaleX(0); }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .count { font-size: 0.85rem; color: #9a9a9a; }

    button {
      font: inherit;
      font-size: 0.85rem;
      padding: 4px 12px;
      border: 1px solid #5a5d62;
      border-radius: 3px;
      background: #3a3d41;
      color: #e6e6e6;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #46494e; }
    button:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }
    button:disabled { opacity: 0.45; cursor: default; }

    .history {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      font-size: 0.85rem;
    }
    .history button {
      border: none;
      background: none;
      padding: 2px 0;
      color: #b8b8b8;
      text-align: left;
    }
    .history button:hover { background: none; color: #fff; text-decoration: underline; }
    .history button[aria-current="true"] { color: #fff; font-weight: 600; }

    .note { margin: 8px 0 0; font-size: 0.8rem; color: #d9a0a0; }

    @media (prefers-reduced-motion: reduce) { .card img { transition: none; } }
    @media (max-width: 640px) { body { padding: 16px; } :root { --card-w: 260px; } }
  </style>
</head>
<body>
  <header>
    <h1>Etali Flips</h1>
    <div class="setup">
      <select class="pick" aria-label="Deck 1 commander"></select>
      <select class="pick" aria-label="Deck 2 commander"></select>
      <select class="pick" aria-label="Deck 3 commander"></select>
      <button id="new-game" type="button">New game</button>
    </div>
  </header>

  <main id="board" class="board"></main>
  <a class="corner" href="/average-deck">Average deck</a>

  <script>
    // Served by the /cardback.jpg route in app.py.
    const CARD_BACK = "/cardback.jpg";
    const FLIP_MS = 150;
    const board = document.getElementById("board");

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // Resolves true once the image is fully loaded and decoded, false on failure.
    function preload(src) {
      return new Promise(resolve => {
        if (!src) return resolve(false);
        const im = new Image();
        im.onload = () => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(() => resolve(true));
        im.onerror = () => resolve(false);
        im.src = src;
      });
    }

    async function newGame() {
      board.textContent = "";
      preload(CARD_BACK); // warm the cache so the back shows immediately
      const commanders = [...document.querySelectorAll(".pick")].map(sel => sel.value);
      const res = await fetch("/api/new-game", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ commanders }),
      });
      const data = await res.json();
      if (!res.ok) {
        board.textContent = data.error || "Could not start a game.";
        return;
      }
      data.decks.forEach((deck, idx) => board.appendChild(buildDeck(deck, idx)));
    }

    async function loadCommanders() {
      const res = await fetch("/api/commanders");
      const list = await res.json();
      document.querySelectorAll(".pick").forEach(sel => {
        sel.append(new Option("Random deck", ""));
        list.forEach(c => sel.append(new Option(`${c.name} (${c.decks})`, c.name)));
      });
    }

    function buildDeck(deck, idx) {
      const history = (deck.revealed || []).map(name => ({ name, image: "" }));
      let exhausted = false;
      let busy = false;

      const el = document.createElement("section");
      el.className = "deck";

      const title = document.createElement("h2");
      title.textContent = deck.tournament;
      title.title = deck.tournament;

      const commanders = document.createElement("p");
      commanders.className = "commanders";
      commanders.textContent = (deck.commanders || []).join(" / ");
      commanders.title = commanders.textContent;

      // Always start face-down; never show deck.stash up front.
      const cardEl = document.createElement("div");
      cardEl.className = "card";
      const img = document.createElement("img");
      img.src = CARD_BACK;
      img.alt = "Face-down card";
      cardEl.appendChild(img);

      const controls = document.createElement("div");
      controls.className = "controls";
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "Reveal";
      const count = document.createElement("span");
      count.className = "count";
      controls.append(button, count);

      const list = document.createElement("ol");
      list.className = "history";
      const note = document.createElement("p");
      note.className = "note";
      note.hidden = true;

      // Flip out while the new image loads; swap only when BOTH are done.
      async function showImage(src, alt) {
        img.classList.add("turning");
        const [loaded] = await Promise.all([preload(src), sleep(FLIP_MS)]);
        if (loaded) {
          img.src = src;
          img.alt = alt;
          note.hidden = true;
        } else {
          img.src = CARD_BACK;
          img.alt = "Face-down card";
          note.textContent = `Couldn't load the image for ${alt}.`;
          note.hidden = false;
        }
        img.classList.remove("turning");
        await sleep(FLIP_MS);
      }

      function render(activeIndex) {
        count.textContent = history.length ? `${history.length} revealed` : "";
        list.textContent = "";
        history.forEach((entry, i) => {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = entry.name;
          if (i === activeIndex) b.setAttribute("aria-current", "true");
          b.disabled = busy;
          b.onclick = async () => {
            if (!entry.image || busy) return;
            busy = true; render(i);
            await showImage(entry.image, entry.name);
            busy = false; render(i);
          };
          li.appendChild(b);
          list.appendChild(li);
        });
        button.disabled = busy || exhausted;
      }

      button.onclick = async () => {
        busy = true; render(-1);
        try {
          const res = await fetch("/api/reveal", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ deck_index: idx }),
          });
          const result = await res.json();

          if (!result || result.error) {
            exhausted = true;
            note.textContent = "No cards left in this library.";
            note.hidden = false;
          } else {
            history.push({ name: result.card, image: result.image });
            await showImage(result.image, result.card);
          }
        } catch (err) {
          note.textContent = "Reveal failed. Is the server running?";
          note.hidden = false;
        }
        busy = false;
        render(history.length - 1);
      };

      render(-1);
      el.append(title, commanders, cardEl, controls, list, note);
      return el;
    }

    document.getElementById("new-game").onclick = newGame;
    loadCommanders().catch(() => {}).then(newGame);
  </script>
</body>
</html>
