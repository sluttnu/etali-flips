<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Average deck</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 32px 48px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
      color: #e6e6e6;
      background: #2b2d30;
    }

    header { max-width: 1500px; margin: 0 auto 24px; }

    .back { font-size: 0.85rem; color: #9a9a9a; text-decoration: none; }
    .back:hover { color: #fff; text-decoration: underline; }

    h1 { margin: 8px 0 4px; font-size: 1.4rem; font-weight: 600; }
    .sub { margin: 0; font-size: 0.85rem; color: #9a9a9a; }

    .titlerow { display: flex; align-items: center; }

    .info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-left: 8px;
      border: 1px solid #7a7d82;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 600;
      color: #b8b8b8;
      cursor: help;
    }
    .info:hover, .info:focus { color: #fff; border-color: #fff; outline: none; }

    .tip {
      display: none;
      position: absolute;
      left: 0;
      top: 26px;
      width: 290px;
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 400;
      line-height: 1.4;
      text-align: left;
      color: #e6e6e6;
      background: #1d1e20;
      border: 1px solid #5a5d62;
      border-radius: 3px;
      z-index: 10;
    }
    .info:hover .tip, .info:focus .tip { display: block; }

    .search { display: flex; gap: 8px; margin-top: 14px; }

    input, button {
      font: inherit;
      font-size: 0.85rem;
      padding: 4px 10px;
      border: 1px solid #5a5d62;
      border-radius: 3px;
      background: #3a3d41;
      color: #e6e6e6;
    }
    input { width: 320px; max-width: 100%; }
    button { cursor: pointer; }
    button:hover { background: #46494e; }
    input:focus-visible, button:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      aspect-ratio: 63 / 88;
      border-radius: 4.5% / 3.2%;
      overflow: hidden;
      background: #1d1e20 url("/cardback.jpg") center / cover no-repeat;
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card img.loaded { opacity: 1; }

    .pct {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 5px 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      background: rgba(0, 0, 0, 0.72);
    }
    .pct small { font-weight: 400; color: #b8b8b8; margin-left: 4px; }

    .error { max-width: 1500px; margin: 0 auto; color: #d9a0a0; }
    .error ul { margin: 10px 0 0; padding-left: 20px; color: #e6e6e6; line-height: 1.7; }
    .error a { color: #e6e6e6; }
  </style>
</head>
<body>
  <header>
    {% if not standalone %}<a class="back" href="/">&larr; Etali Flips</a>{% endif %}
    <div class="titlerow"><span id="mtg-menu"></span><h1 id="title">Average deck</h1><span class="info" tabindex="0" aria-describedby="info-tip" aria-label="About this data">?<span class="tip" id="info-tip" role="tooltip">Loading&hellip;</span></span></div>
    <p class="sub" id="sub">Loading&hellip;</p>
    <form id="search" class="search">
      <input id="q" list="cmds" placeholder="Search commanders" autocomplete="off" />
      <datalist id="cmds"></datalist>
      <button type="submit">Show</button>
      <button type="button" id="reset-filters" style="margin-left: 4px;">Reset filters</button>
    </form>
  </header>

  <main id="grid" class="grid"></main>

  <script>
    const grid = document.getElementById("grid");
    const DEFAULT_COMMANDER = {{ default_commander|tojson }};
    const commander = (new URLSearchParams(location.search).get("commander")
                        || DEFAULT_COMMANDER).trim();

    const state = {
      data: null,
      selectedCards: [],
    };

    function pctLabel(x) {
      const p = x * 100;
      return p > 0 && p < 1 ? "<1%" : Math.round(p) + "%";
    }

    function buildFilteredCards() {
      const deckSet = getCurrentDeckSet();
      const deckIndexes = [...deckSet];
      const totalMatches = deckIndexes.length;

      if (!totalMatches) {
        return { cards: [], deckCount: 0 };
      }

      const counts = new Map();

      for (const deckIndex of deckIndexes) {
        const deck = state.data.decks[deckIndex];
        for (const cardName of deck.cards) {
          counts.set(cardName, (counts.get(cardName) || 0) + 1);
        }
      }

      const cards = [...counts.entries()].map(([name, deckCount]) => ({
        name,
        inclusion: deckCount / totalMatches,
        decks: deckCount,
      }));

      const metaByName = new Map((state.data.cards || []).map(c => [c.name, c]));
      cards.forEach(c => {
        const meta = metaByName.get(c.name) || {};
        c.image = meta.image || "";
        c.avg_copies = meta.avg_copies || 0;
        c.land = !!meta.land;
        c.selected = state.selectedCards.includes(c.name);
      });

      cards.sort((a, b) => {
        if (a.selected !== b.selected) return Number(b.selected) - Number(a.selected);
        const byInclusion = b.inclusion - a.inclusion;
        if (byInclusion !== 0) return byInclusion;
        if (!!a.land !== !!b.land) return Number(a.land) - Number(b.land);
        return a.name.localeCompare(b.name);
      });

      return { cards, deckCount: totalMatches };
    }

    function getCurrentDeckSet() {
      if (!state.data || !state.data.decks) return new Set();

      let deckSet = new Set(state.data.decks.map((_, i) => i));

      for (const cardName of state.selectedCards) {
        const matches = new Set((state.data.deck_map && state.data.deck_map[cardName]) || []);
        deckSet = new Set([...deckSet].filter(i => matches.has(i)));
      }

      return deckSet;
    }

    function renderCardGrid(cards, deckCount) {
      grid.innerHTML = "";

      if (!cards.length) {
        const empty = document.createElement("div");
        empty.className = "error";
        empty.textContent = "No cards match the current deck filter.";
        grid.appendChild(empty);
        return;
      }

      const metaByName = new Map((state.data.cards || []).map(c => [c.name, c]));

      cards.forEach(c => {
        const meta = metaByName.get(c.name) || {};
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.cardName = c.name;
        card.title = state.selectedCards.includes(c.name)
          ? `Selected: click to remove "${c.name}" from the filter`
          : `Click to filter to decks containing "${c.name}"`;

        if (state.selectedCards.includes(c.name)) {
          card.style.outline = "2px solid #8ab4f8";
          card.style.outlineOffset = "2px";
        }

        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = c.name;
        img.onload = () => img.classList.add("loaded");
        if (meta.image) img.src = meta.image;
        card.appendChild(img);

        const pct = document.createElement("div");
        pct.className = "pct";
        pct.textContent = pctLabel(c.inclusion);
        if ((meta.avg_copies || 0) >= 1.5) {
          const small = document.createElement("small");
          small.textContent = "×" + (meta.avg_copies || 0).toFixed(1);
          pct.appendChild(small);
        }
        card.appendChild(pct);

        card.addEventListener("click", () => {
          const cardName = card.dataset.cardName;

          if (state.selectedCards.includes(cardName)) {
            state.selectedCards = state.selectedCards.filter(n => n !== cardName);
          } else {
            state.selectedCards = [...state.selectedCards, cardName];
          }

          renderCurrentDeckView();
        });

        grid.appendChild(card);
      });

      if (state.selectedCards.length) {
        document.getElementById("sub").textContent =
          `${deckCount} decks match the selected cards: ${state.selectedCards.join(", ")}`;
      } else {
        document.getElementById("sub").textContent =
          `${state.data.deck_count} decks, ${state.data.cards.length} distinct cards, highest inclusion first`;
      }
    }

    function renderCurrentDeckView() {
      if (!state.data) return;

      const { cards, deckCount } = buildFilteredCards();
      renderCardGrid(cards, deckCount);
    }

    function resetFilters() {
      state.selectedCards = [];
      renderCurrentDeckView();
    }

    async function load() {
      if (!commander) {
        document.getElementById("sub").textContent =
          "Search for a commander to see its average deck.";
        return;
      }

      const res = await fetch("/api/average-deck?commander=" + encodeURIComponent(commander));
      const data = await res.json();

      if (!res.ok) {
        document.getElementById("sub").textContent = "";
        grid.className = "error";
        grid.textContent = data.error || "Could not load the average deck.";
        if (data.choices) {
          const ul = document.createElement("ul");

          const choices = [...data.choices].sort((a, b) => {
            const byCount = (b.decks ?? 0) - (a.decks ?? 0);
            return byCount !== 0
              ? byCount
              : (a.name || "").localeCompare(b.name || "");
          });

          choices.forEach(c => {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = "?commander=" + encodeURIComponent(c.name);
            a.textContent = c.name;
            li.append(a, ` (${c.decks} decks)`);
            ul.appendChild(li);
          });

          grid.appendChild(ul);
        }
        return;
      }

      state.data = data;
      state.selectedCards = [];

      document.getElementById("title").textContent = "Average deck: " + data.commander;
      document.title = "Average deck: " + data.commander;

      renderCurrentDeckView();
    }

    document.getElementById("q").value = commander;

    document.getElementById("search").onsubmit = e => {
      e.preventDefault();
      const q = document.getElementById("q").value.trim();
      location.search = q ? "?commander=" + encodeURIComponent(q) : "";
    };

    document.getElementById("reset-filters").addEventListener("click", () => {
      resetFilters();
    });

    async function loadCommanders() {
      const list = await (await fetch("/api/commanders")).json();
      const dl = document.getElementById("cmds");
      dl.innerHTML = "";

      const sorted = [...list].sort((a, b) => {
        const byCount = (b.decks ?? 0) - (a.decks ?? 0);
        return byCount !== 0 ? byCount : (a.name || "").localeCompare(b.name || "");
      });

      sorted.forEach(c => {
        const o = document.createElement("option");
        o.value = c.name;
        o.label = `${c.name} (${c.decks})`;
        dl.appendChild(o);
      });
    }

    async function loadInfo() {
      const d = await (await fetch("/api/dataset-info")).json();
      document.getElementById("info-tip").textContent =
        `Built from topdeck.gg tournament data: decks from players who scored at least ` +
        `half of the available points, in tournaments from the last ${d.days} days with ` +
        `at least ${d.min_players} players and at least ${d.min_swiss} Swiss rounds. ` +
        `${d.decks} decks from ${d.tournaments} tournaments.`;
    }

    loadInfo().catch(() => {});
    loadCommanders().catch(() => {});
    load();
  </script>
  <script src="/_widgets/mtg-menu.js" defer></script>
</body>
</html>
