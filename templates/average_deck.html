<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Average deck</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 32px 48px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
      color: #e6e6e6;
      background: #2b2d30;
    }

    header { max-width: 1500px; margin: 0 auto 24px; }

    .back { font-size: 0.85rem; color: #9a9a9a; text-decoration: none; }
    .back:hover { color: #fff; text-decoration: underline; }

    h1 { margin: 8px 0 4px; font-size: 1.4rem; font-weight: 600; }
    .sub { margin: 0; font-size: 0.85rem; color: #9a9a9a; }

    .titlerow { display: flex; align-items: center; }

    .info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-left: 8px;
      border: 1px solid #7a7d82;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 600;
      color: #b8b8b8;
      cursor: help;
    }
    .info:hover, .info:focus { color: #fff; border-color: #fff; outline: none; }

    .tip {
      display: none;
      position: absolute;
      left: 0;
      top: 26px;
      width: 290px;
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 400;
      line-height: 1.4;
      text-align: left;
      color: #e6e6e6;
      background: #1d1e20;
      border: 1px solid #5a5d62;
      border-radius: 3px;
      z-index: 10;
    }
    .info:hover .tip, .info:focus .tip { display: block; }

    .search { display: flex; gap: 8px; margin-top: 14px; }

    .daterow { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 0.85rem; color: #9a9a9a; }
    .daterow input[type=range] { width: 260px; padding: 0; }
    .daterow output { color: #e6e6e6; min-width: 9ch; }

    input, button {
      font: inherit;
      font-size: 0.85rem;
      padding: 4px 10px;
      border: 1px solid #5a5d62;
      border-radius: 3px;
      background: #3a3d41;
      color: #e6e6e6;
    }
    input { width: 320px; max-width: 100%; }
    button { cursor: pointer; }
    button:hover { background: #46494e; }
    input:focus-visible, button:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      aspect-ratio: 63 / 88;
      border-radius: 4.5% / 3.2%;
      overflow: hidden;
      background: #1d1e20 url("/cardback.jpg") center / cover no-repeat;
    }

    .card.selected { outline: 2px solid #8ab4f8; outline-offset: 2px; }
    .card.excluded { outline: 2px solid #e57373; outline-offset: 2px; }
    .card.excluded img.loaded { opacity: 0.35; }
    .card.excluded .pct { color: #e57373; }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card img.loaded { opacity: 1; }

    .strip { display: block; height: 6px; margin-top: 5px; border-radius: 2px; background: #3f4247; }

    .pct {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 5px 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      background: rgba(0, 0, 0, 0.72);
    }
    .pct small { font-weight: 400; color: #b8b8b8; margin-left: 4px; }

    .error { max-width: 1500px; margin: 0 auto; color: #d9a0a0; }
    .error ul { margin: 10px 0 0; padding-left: 20px; color: #e6e6e6; line-height: 1.7; }
    .error a { color: #e6e6e6; }
  </style>
</head>
<body>
  <header>
    {% if not standalone %}<a class="back" href="/">&larr; Etali Flips</a>{% endif %}
    <div class="titlerow"><span id="mtg-menu"></span><h1 id="title">Average deck</h1><span class="info" tabindex="0" aria-describedby="info-tip" aria-label="About this data">?<span class="tip" id="info-tip" role="tooltip">Loading&hellip;</span></span></div>
    <p class="sub" id="sub">Loading&hellip;</p>
    <form id="search" class="search">
      <input id="q" list="cmds" placeholder="Search commanders" autocomplete="off" />
      <datalist id="cmds"></datalist>
      <button type="submit">Show</button>
      <button type="button" id="toggle-lands" aria-pressed="false">Hide lands</button>
      <button type="button" id="reset-filters" style="margin-left: 4px;">Reset filters</button>
    </form>
    <div class="daterow">
      <label for="age">Decks from</label>
      <input type="range" id="age" min="1" max="365" value="365" disabled>
      <output id="age-label">all time</output>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <script src="average_deck.js"></script>
  <script src="/_widgets/mtg-menu.js" defer></script>
</body>
</html>
