services:
  etali-flips:
    image: ghcr.io/sluttnu/etali-flips:${TAG:-latest}
    container_name: etali-flips
    restart: unless-stopped
    tmpfs: [/tmp]
    env_files:
      - .env
    volumes:
      - etali-flips:/app/cache
      - ./cardback.jpg:/app/cardback.jpg:ro
      - ./data:/app/data
    environment:
      PORT: "9000"
    networks: [proxy]

networks:
  proxy:
    external: true
    name: proxy

volumes:
  etali-flips-cache:
