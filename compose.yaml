services:
  etali-flips:
    image: ghcr.io/sluttnu/etali-flips:${TAG:-latest}
    container_name: etali-flips
    restart: unless-stopped
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      PORT: "9000"
    volumes:
      - etali-flips-cache:/app/cache
      - ./templates/cardback.jpg:/app/cardback.jpg:ro
      - ./data:/app/data
    networks:
      - proxy
  data-generation:
    image: ghcr.io/sluttnu/etali-flips:${TAG:-latest}
    container_name: data-generation
    command: python data-generation.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    profiles: ["jobs"]

networks:
  proxy:
    external: true
    name: proxy

volumes:
  etali-flips-cache:
